  <circle cx="1340" cy="118" r="220" fill="#7DF3A5" opacity="0.08"/>
  <circle cx="214" cy="610" r="260" fill="#B8F05E" opacity="0.08"/>
  <path d="M88 594C254 482 374 513 524 390C692 252 863 234 1020 300C1193 373 1290 282 1514 142" stroke="#9AF0BD" stroke-opacity="0.18" stroke-width="3"/>

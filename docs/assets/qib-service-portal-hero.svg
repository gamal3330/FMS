<svg width="1600" height="720" viewBox="0 0 1600 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">QIB Service Portal Hero</title>
  <desc id="desc">Professional banking service portal illustration showing requests, approvals, messaging, documents, reports, and security modules.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="60" x2="1460" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#061A12"/>
      <stop offset="0.46" stop-color="#0A2B1D"/>
      <stop offset="1" stop-color="#0D3A24"/>
    </linearGradient>
    <linearGradient id="panel" x1="280" y1="106" x2="1274" y2="626" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#B8F05E"/>
      <stop offset="1" stop-color="#42C77A"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.45 0 0 0 0 0.95 0 0 0 0 0.62 0 0 0 0.38 0"/>
      <feBlend in2="SourceGraphic" mode="screen"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#A7F3D0" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="720" rx="34" fill="url(#bg)"/>
